<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Partner App</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 2em; }
      textarea { width: 100%; height: 150px; }
      pre { background-color: #f4f4f4; padding: 1em; }
    </style>
  </head>
  <body>
    <h1>Partner Workflow</h1>
    <form method="post">
      <label for="prompt">Task Prompt:</label><br>
      <textarea name="prompt" id="prompt"></textarea><br><br>
      <button type="submit">Submit</button>
    </form>
    {% if response %}
    <h2>Response</h2>
    <pre>{{ response }}</pre>
    {% endif %}
  </body>
</html>
